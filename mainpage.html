<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo App</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: white;
            font-family: 'Courier New', monospace;
            margin: 0;
        }

        .frame {
            border: 20px solid #003801;
            padding: 12px 24px;
            text-align: center;
        }

        h1, h2, h3 {
            color: #003801;
        }

        .container {
            background-color: white;
            text-align: center;
            min-width: 40%;
            height: auto;
            padding: 12px 12px;
            border-radius: 0%;
        }

        .ots {
            padding: 8px 12px;
        }

        button {
            border-radius: 1%;
            background-color: #003801;
            color: white;
            font-size: 24px;
            font-family: 'Courier New', monospace;
            border: none;
            cursor: pointer;
            padding: 4px 16px;
        }

        button:hover {
            opacity: 0.85;
        }

        input {
            color: #003801;
            background-color: white;
            font-family: 'Courier New', monospace;
            font-size: 20px;
            border: 2px solid #003801;
            padding: 4px 8px;
        }

        a {
            color: #003801;
        }

        ul {
            list-style: none;
            padding: 0;
            text-align: left;
        }

        li {
            color: #003801;
            font-size: 20px;
            padding: 6px 0;
            border-bottom: 1px dashed #003801;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        li .task-text {
            flex: 1;
            word-break: break-word;
        }

        .del {
            font-size: 16px;
            padding: 2px 10px;
            flex-shrink: 0;
        }

        #status {
            color: #003801;
            font-size: 14px;
            min-height: 18px;
        }

        /* ---- Статистика по датам ---- */
        #statsSection {
            margin-top: 24px;
        }

        #statsList {
            list-style: none;
            padding: 0;
            text-align: left;
            margin-top: 8px;
        }

        #statsList li {
            color: #003801;
            font-size: 18px;
            padding: 8px 10px;
            border: 2px solid #003801;
            border-bottom: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        #statsList li:last-child {
            border-bottom: 2px solid #003801;
        }

        #statsList li:nth-child(even) {
            background-color: #f2f7f2;
        }

        #statsList .date {
            font-weight: bold;
        }

        #statsList .count {
            background-color: #003801;
            color: white;
            padding: 2px 12px;
            font-size: 16px;
        }

        #statsStatus {
            color: #003801;
            font-size: 14px;
            min-height: 18px;
            margin-bottom: 4px;
        }

        .refresh-btn {
            font-size: 16px;
            padding: 4px 14px;
        }
    </style>
</head>
<body>
    <div class="frame">
        <div class="container">
            <h1>ToDo</h1>
            <h3>Список дел</h3>

            <form id="addForm">
                <div class="ots">
                    <input type="text" name="task" id="taskInput" placeholder="Новая задача..." required>
                </div>
                <div class="ots">
                    <button type="submit">Принять</button>
                </div>
            </form>

            <h2>Задачи</h2>
            <div id="status"></div>
            <ul id="taskList"><!-- заполняется из /tasks --></ul>

            <!-- ---- Статистика: сколько задач добавлено в каждый день ---- -->
            <div id="statsSection">
                <h2>Добавлено по датам</h2>
                <div id="statsStatus"></div>
                <div class="ots">
                    <button type="button" class="refresh-btn" id="refreshStatsBtn">Обновить статистику</button>
                </div>
                <ul id="statsList"><!-- заполняется из /statistics --></ul>
            </div>
        </div>
    </div>

    <script>
        const list        = document.getElementById('taskList');
        const form        = document.getElementById('addForm');
        const input       = document.getElementById('taskInput');
        const status      = document.getElementById('status');

        const statsList   = document.getElementById('statsList');
        const statsStatus = document.getElementById('statsStatus');
        const refreshBtn  = document.getElementById('refreshStatsBtn');

        // ---- 1. Загрузка задач с GET /tasks ----
        async function loadTasks() {
            status.textContent = 'Загрузка...';
            try {
                const res = await fetch('/tasks');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const tasks = await res.json();   // [{id, text}, ...]

                list.innerHTML = '';
                tasks.forEach(t => list.appendChild(createTaskElement(t.id, t.text)));
                status.textContent = tasks.length ? '' : 'Пока задач нет';
            } catch (err) {
                status.textContent = 'Ошибка загрузки: ' + err.message;
            }
        }

        // ---- 2. Построение <li> с кнопкой удаления ----
        function createTaskElement(id, text) {
            const li = document.createElement('li');
            li.dataset.id = id;

            const span = document.createElement('span');
            span.className = 'task-text';
            span.textContent = text;

            const btn = document.createElement('button');
            btn.className = 'del';
            btn.textContent = 'Удалить';
            btn.addEventListener('click', () => deleteTask(id));

            li.appendChild(span);
            li.appendChild(btn);
            return li;
        }

        // ---- 3. Добавление через POST /add ----
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            try {
                const res = await fetch('/add', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({'task': text})
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const task = await res.json();   // {id, text}

                list.appendChild(createTaskElement(task.id, task.text));
                input.value = '';
                status.textContent = '';

                loadStats();
            } catch (err) {
                status.textContent = 'Ошибка добавления: ' + err.message;
            }
        });

        // ---- 4. Удаление через DELETE /delete/<id> ----
        async function deleteTask(id) {
            try {
                const res = await fetch('/delete/' + id, {method: 'DELETE'});
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const li = list.querySelector('li[data-id="' + id + '"]');
                if (li) li.remove();
                if (!list.children.length) status.textContent = 'Пока задач нет';

                loadStats();
            } catch (err) {
                status.textContent = 'Ошибка удаления: ' + err.message;
            }
        }

        // ---- 5. Статистика по датам с GET /statistics ----
        // Ожидаемый формат ответа: { "2026-11-10": 3, "2026-11-09": 5 } 
        // либо [{"date": "2026-11-10", "count": 3}, ...]
        async function loadStats() {
            statsStatus.textContent = 'Загрузка статистики...';
            try {
                const res = await fetch('/statistics');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();

                // нормализуем к массиву [{date, count}]
                let rows;
                if (Array.isArray(data)) {
                    rows = data.map(r => ({date: r.date, count: r.count}));
                } else {
                    rows = Object.entries(data).map(([date, count]) => ({date, count}));
                }

                // сортируем по дате по убыванию (свежие сверху)
                rows.sort((a, b) => b.date.localeCompare(a.date));

                statsList.innerHTML = '';
                if (!rows.length) {
                    statsStatus.textContent = 'Статистики пока нет';
                    return;
                }

                rows.forEach(r => {
                    const li = document.createElement('li');

                    const dateSpan = document.createElement('span');
                    dateSpan.className = 'date';
                    dateSpan.textContent = r.date;

                    const countSpan = document.createElement('span');
                    countSpan.className = 'count';
                    countSpan.textContent = r.count + ' шт.';

                    li.appendChild(dateSpan);
                    li.appendChild(countSpan);
                    statsList.appendChild(li);
                });

                const total = rows.reduce((s, r) => s + r.count, 0);
                statsStatus.textContent = 'Всего добавлено: ' + total + ' (по ' + rows.length + ' дн.)';
            } catch (err) {
                statsStatus.textContent = 'Ошибка загрузки статистики: ' + err.message;
                statsList.innerHTML = '';
            }
        }

        // ---- 6. Кнопка обновления ----
        refreshBtn.addEventListener('click', loadStats);

        // ---- 7. Старт ----
        loadTasks();
        loadStats();
    </script>
</body>
</html>
